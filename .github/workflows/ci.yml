
name: Book Publisher CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run automated tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mithunmh19/book-publisher-api:latest
            mithunmh19/book-publisher-api:${{ github.sha }}

      # Temporary diagnostic: identifies the GitHub OIDC claims.
      # It never prints the OIDC token itself.
      - name: Diagnose GitHub OIDC claims
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          JWT=$(printf '%s' "$RESPONSE" | jq -r '.value')

          JWT="$JWT" python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["JWT"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC subject (sub):", claims.get("sub"))
          print("OIDC audience (aud):", claims.get("aud"))
          PY

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to EC2 through Systems Manager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_INSTANCE_ID: i-085ddbc9eafbdf6d7
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Book Publisher API from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "docker pull mithunmh19/book-publisher-api:latest",
              "docker rm -f book-publisher-api || true",
              "docker run -d --name book-publisher-api --restart unless-stopped -p 8000:8000 mithunmh19/book-publisher-api:latest",
              "for i in $(seq 1 20); do if curl -fsS http://localhost:8000/health; then exit 0; fi; sleep 3; done",
              "docker logs --tail 50 book-publisher-api",
              "exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM deployment command: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Waiting}"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded!"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment."
          echo "Check AWS Systems Manager Run Command for details."
          exit 1
